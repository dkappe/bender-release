name: Disposable Windows SSH

on:
  workflow_dispatch:

jobs:
  windows-runner:
    runs-on: windows-latest
    timeout-minutes: 60          # don't burn 6 hours if you forget it
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Launch SSH Session (tmate)
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 55
        with:
          limit-access-to-actor: true      # only your GitHub SSH keys; also disables web shell
          connect-timeout-seconds: 600     # 10 min to connect before it gives up
          detached: false
          
