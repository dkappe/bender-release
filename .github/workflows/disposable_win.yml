name: Disposable Windows SSH

on:
  workflow_dispatch:

jobs:
  windows-runner:
    runs-on: windows-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Launch SSH Session
        uses: lhotari/action-upterm@v1
        with:
          limit-access-to-actor: true

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "SSH session is active. Waiting for manual disconnect or timeout..."
          # Keeps the runner alive for up to 5 hours (18,000 seconds)
          Start-Sleep -Seconds 18000
          
