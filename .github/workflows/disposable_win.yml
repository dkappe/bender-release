name: Disposable Windows SSH

on:
  workflow_dispatch:

jobs:
  windows-runner:
    runs-on: windows-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Launch SSH Session (tmate)
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          # Disables the web shell and forces standard terminal attachment
          connect-timeout-seconds: 60
          
