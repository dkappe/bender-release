name: Disposable Windows SSH (Tailscale)

on:
  workflow_dispatch:

jobs:
  windows-runner:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Install and configure OpenSSH server
        shell: pwsh
        run: |
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0

          # Default SSH shell = PowerShell 7
          New-ItemProperty -Path "HKLM:\SOFTWARE\OpenSSH" -Name DefaultShell `
            -Value "C:\Program Files\PowerShell\7\pwsh.exe" -PropertyType String -Force

          # Authorize your GitHub SSH public keys (runneradmin is an admin account)
          $keys = Invoke-RestMethod "https://github.com/${{ github.actor }}.keys"
          if (-not $keys) { throw "No SSH keys found on GitHub account ${{ github.actor }}" }
          New-Item -ItemType Directory -Force C:\ProgramData\ssh | Out-Null
          $f = "C:\ProgramData\ssh\administrators_authorized_keys"
          Set-Content -Path $f -Value $keys -Encoding ascii
          icacls $f /inheritance:r /grant "Administrators:F" /grant "SYSTEM:F"

          # Make sure port 22 is open
          if (-not (Get-NetFirewallRule -Name OpenSSH-Server-In-TCP -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule -Name OpenSSH-Server-In-TCP -DisplayName "OpenSSH Server" `
              -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22
          }

          Start-Service sshd

      - name: Wait for SSH (create C:\continue to finish)
        shell: pwsh
        run: |
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "======================================"
          Write-Host " Connect with:  ssh runneradmin@$ip"
          Write-Host "======================================"
          while (-not (Test-Path C:\continue)) { Start-Sleep 10 }
          
